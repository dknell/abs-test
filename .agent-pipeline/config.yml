# Dextre's own sample per-repo config (mirrors the Artemis-shaped config in agent-build-system.md).
standards: STANDARDS.md
build: pnpm turbo run build
test: pnpm turbo run test
lint: pnpm turbo run lint
policy_gate:
  forbidden: ["DROP TABLE", "DELETE FROM (?!.*WHERE)"]
  protected_paths: [".github/**", "infra/**", ".agent-pipeline/**"]
acceptance: per-issue
plugins:
  notifier:
    enabled: true
    slack:
      channel: "#artemis-builds"
      severity: success-and-errors
  ticket:
    linear:
      team: ARTEMIS
      project: "Build pipeline"
